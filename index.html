<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title">Artist Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="icon" type="image/png" href="/img/favicone.png">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>

<body> <!-- HERO -->
    <section class="hero">
        <div class="overlay"></div>
        <div class="hero-content">
            <h1 id="hero_title"></h1>
            <p id="hero_tagline"></p> <a id="hero_button" class="btn" target="_blank"></a>
        </div>
    </section> <!-- ABOUT -->
    <section class="about creative">
        <div class="container">
            <h2 class="section-heading" id="about_heading"></h2>
            <p id="about_para_1"></p>
            <p id="about_para_2"></p>
        </div>
    </section> <!-- JOURNEY -->
    <section class="journey creative">
        <h2 class="section-heading"><span>The </span>Journey</h2>
        <div class="slider">
            <div class="slides" id="journey_slides"></div>
        </div>
    </section> <!-- IMPACT -->
    <section class="impact creative">
        <h2 class="section-heading">Im<span>pa</span>ct</h2>
        <div class="cards" id="stats_container"></div>
    </section> <!-- MUSIC -->
    <section class="music-showcase creative">
        <div class="music-container">
            <div class="album-side" id="album_iframe"></div>
            <div class="singles-grid" id="singles_container"></div>
        </div>
    </section>
    <section class="video-vault-section">
        <h2 class="section-heading"> <span>Visual </span>Work </h2>
        <div class="vault-container"> <!-- VIDEO BENTO -->
            <div class="video-bento" id="video_bento"></div> <!-- SHORTS / REELS -->
            <div class="shorts-reel-wrapper">
                <div class="reel-header">SHORTS & REELS</div>
                <div class="swiper shorts-swiper">
                    <div class="swiper-wrapper" id="shorts_container"></div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </section> <!-- ALBUM CTA -->
    <section class="album creative">
        <div class="album-box">
            <h2 class="section-heading" id="album_title"></h2>
            <p id="album_description"></p> <a id="album_button" class="btn" target="_blank"></a>
        </div>
    </section> <!-- VISION -->
    <section class="vision creative">
        <div class="vision-box">
            <h2 class="section-heading" id="vision_heading"></h2>
            <p id="vision_text"></p>
        </div>
    </section> <!-- <h2 class="section-heading" id="album_title"></h2> --> <!-- CONTACT -->
    <section class="contact creative">
        <h2 class="section-heading">Bookings <span>&</span> Business</h2>
        <p>Email: <span id="contact_email"></span></p>
        <p>Phone: <span id="contact_phone"></span></p>
    </section>
    <script src="script.js"></script>
    <script async src="https://www.instagram.com/embed.js"></script>
</body>

</html>
